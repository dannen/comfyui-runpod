# project.conf values for this example (tools/new-project.sh applies them).
PROJECT=minimax-h3
IMAGE=YOUR_DOCKERHUB_USER/minimax-h3-comfyui
POD_NAME=minimax-h3-comfyui
VOLUME_NAME=minimax-h3-storage
VOLUME_GB=80
GPU_TYPES="NVIDIA RTX PRO 6000 Blackwell Server Edition,NVIDIA H100 80GB HBM3,NVIDIA A100 80GB PCIe"
AUTH_FILE=~/.api/runpod/minimax-h3.auth
LOCAL_NAME=minimax-h3-local
LOCAL_INPUT=~/Pictures/minimax-h3/input
LOCAL_OUTPUT=~/Pictures/minimax-h3/output
LOCAL_STATE=~/.local/share/minimax-h3-local

# Where models.txt, custom_nodes.txt and workflows/ came from. To refresh them:
#   tools/template-models.py $TEMPLATES --ref $TEMPLATES_REF --write examples/minimax-h3
TEMPLATES="video_minimax_h3_t2v video_minimax_h3_i2v video_minimax_h3_r2v"
TEMPLATES_REF=67984637eefcd4825dcf5c134e39034785be1682
