# project.conf values for this example (tools/new-project.sh applies them).
PROJECT=krea2
IMAGE=YOUR_DOCKERHUB_USER/krea2-comfyui
POD_NAME=krea2-comfyui
VOLUME_NAME=krea2-storage
VOLUME_GB=30
