# project.conf values for this example (tools/new-project.sh applies them).
PROJECT=ltx-2.3
IMAGE=YOUR_DOCKERHUB_USER/ltx-2.3-comfyui
POD_NAME=ltx-2.3-comfyui
VOLUME_NAME=ltx-2.3-storage
VOLUME_GB=60
GPU_TYPES="NVIDIA L40S,NVIDIA RTX 6000 Ada Generation,NVIDIA A40,NVIDIA RTX A6000"
AUTH_FILE=~/.api/runpod/ltx-2.3.auth
R2_PREFIX=ltx-2.3/models
LOCAL_NAME=ltx-2.3-local
LOCAL_INPUT=~/Pictures/ltx-2.3/input
LOCAL_OUTPUT=~/Pictures/ltx-2.3/output
LOCAL_STATE=~/.local/share/ltx-2.3-local

# Where models.txt, custom_nodes.txt and workflows/ came from. To refresh them:
#   tools/template-models.py $TEMPLATES --ref $TEMPLATES_REF --write examples/ltx-2.3
TEMPLATES="video_ltx2_3_t2v video_ltx2_3_i2v"
TEMPLATES_REF=67984637eefcd4825dcf5c134e39034785be1682
