# project.conf values for this example (tools/new-project.sh applies them).
PROJECT=marigold-v2
IMAGE=YOUR_DOCKERHUB_USER/marigold-v2-comfyui
POD_NAME=marigold-v2-comfyui
VOLUME_NAME=marigold-v2-storage
VOLUME_GB=30
GPU_TYPES="NVIDIA RTX A5000,NVIDIA GeForce RTX 4090,NVIDIA L40S,NVIDIA A40"
AUTH_FILE=~/.api/runpod/marigold-v2.auth
R2_PREFIX=marigold-v2/models
LOCAL_NAME=marigold-v2-local
LOCAL_INPUT=~/Pictures/marigold-v2/input
LOCAL_OUTPUT=~/Pictures/marigold-v2/output
LOCAL_STATE=~/.local/share/marigold-v2-local

# Where models.txt, custom_nodes.txt and workflows/ came from. To refresh them:
#   tools/template-models.py $TEMPLATES --ref $TEMPLATES_REF --write examples/marigold-v2
TEMPLATES="image_marigold_v2_depth_estimation image_marigold_v2_surface_normal_estimation image_marigold_v2_albedo_estimation"
TEMPLATES_REF=67984637eefcd4825dcf5c134e39034785be1682
