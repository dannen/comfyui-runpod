# project.conf values for this example (tools/new-project.sh applies them).
PROJECT=qwen-image
IMAGE=YOUR_DOCKERHUB_USER/qwen-image-comfyui
POD_NAME=qwen-image-comfyui
VOLUME_NAME=qwen-image-storage
VOLUME_GB=50
GPU_TYPES="NVIDIA GeForce RTX 4090,NVIDIA L40S,NVIDIA RTX 6000 Ada Generation,NVIDIA RTX A6000"
AUTH_FILE=~/.api/runpod/qwen-image.auth
LOCAL_NAME=qwen-image-local
LOCAL_INPUT=~/Pictures/qwen-image/input
