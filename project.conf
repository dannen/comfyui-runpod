# project.conf: the one file a new project edits first.
#
# KEY=value lines, # comments, optional quotes; ~ and $HOME are expanded. It is
# read, never sourced or run (tools/rp.py and tools/conf.sh parse it), so
# nothing here can execute. Values in the environment win over this file, and
# project.local.conf (gitignored, same format) wins over both defaults here:
# put machine-specific paths and ports there.

# Short name: used in pod, volume and container names and the HTTP User-Agent.
PROJECT=example

# Docker Hub repository. Tags are <git sha>[-cu128] (build.sh); pods are rolled
# out by tag, never by :latest.
IMAGE=YOUR_DOCKERHUB_USER/example-comfyui

# The persistent pod and its network volumes. One volume per datacenter, named
# VOLUME_NAME-<suffix> (e.g. example-storage-ks); tools/pod.py finds a
# datacenter's volume by this prefix.
POD_NAME=example-comfyui
VOLUME_NAME=example-storage
VOLUME_GB=30
CONTAINER_DISK_GB=40

# Tried in order until one has stock (tools/pod.py create), each with its own
# volume. Pick datacenters with network volumes, an S3 gateway and the GPUs you
# want (tools/gpus.py), e.g. DATACENTERS=US-KS-2,US-CA-2
DATACENTERS=
GPU_TYPES="NVIDIA L40S,NVIDIA RTX A5000,NVIDIA RTX A6000"

# user:password for ComfyUI (and the optional app) behind nginx on the pod.
# RunPod's proxy URLs are public: tools/pod.py refuses to create or update a
# pod without it unless --no-auth. Mode 600, outside the repo.
AUTH_FILE=~/.api/runpod/example.auth

# Optional second web app next to ComfyUI (app/run.sh in the image). Leave
# empty for none. Its public port; nginx puts the same password in front.
APP_PORT=

# Credentials, outside the repo (mode 600). These are the defaults; RUNPOD_API_KEY
# and AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY in the environment win over files.
# s3-credentials is aws-cli style: aws_access_key_id = ... / aws_secret_access_key = ...
RUNPOD_KEY_FILE=~/.api/runpod/api.key
S3_CREDENTIALS_FILE=~/.api/runpod/s3-credentials

# Local runs (run-local.sh). Relative paths are relative to this file.
LOCAL_NAME=example-local
LOCAL_IMAGE_SUFFIX=-cu128
LOCAL_COMFY_PORT=8188
LOCAL_APP_PORT=
LOCAL_MODELS=./models
LOCAL_INPUT=~/Pictures/example/input
LOCAL_OUTPUT=~/Pictures/example/output
LOCAL_STATE=~/.local/share/example-local

# Cloudflare R2 (optional, tools/fill-volume.py --source r2 / --push): env files with
# R2_ACCOUNT_ID=, R2_ACCESS_KEY_ID=, R2_SECRET_ACCESS_KEY=, R2_BUCKET= [, R2_PREFIX=].
# A read-only token for fetching (it goes onto pods), a read-write one for pushing.
R2_ENV_FILE_RO=~/.api/cloudflare/r2-ro.env
R2_ENV_FILE=~/.api/cloudflare/r2.env
